version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/frontend, /services/core, /services/ingest]
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directories: [/frontend, /docs/site]
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      nextjs-major:
        applies-to: version-updates
        patterns: [next, eslint-config-next]
        update-types: [major]
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /services/cli
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: nuget
    directories: [/services/core, /services/ingest, /services/shared]
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      ef-core-major:
        applies-to: version-updates
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore"
          - "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: [major]
      nuget-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
