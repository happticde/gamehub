version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/frontend, /services/core, /services/ingest]
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directories: [/frontend, /docs/site]
    ignore:
      # TS 7.0 has no compiler API for typescript-eslint. Recheck support before upgrading.
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        versions: [">=7.0.0 <7.1.0"]
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      framework-major:
        applies-to: version-updates
        patterns: [next, react, react-dom]
        update-types: [major]
      framework-minor-and-patch:
        applies-to: version-updates
        patterns: [next, react, react-dom]
        update-types: [minor, patch]
      lint-minor-and-patch:
        applies-to: version-updates
        patterns: ["eslint*", "@eslint/*", "@next/eslint-plugin-next", "@typescript-eslint/*", "typescript-eslint"]
        update-types: [minor, patch]
      tailwind-minor-and-patch:
        applies-to: version-updates
        patterns: [tailwindcss, "@tailwindcss/*", tailwind-merge, tw-animate-css]
        update-types: [minor, patch]
      ui-minor-and-patch:
        applies-to: version-updates
        patterns: [radix-ui, "@radix-ui/*", cmdk, lucide-react]
        update-types: [minor, patch]
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /services/cli
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # v0 minor releases can change APIs. Review this group as a migration.
      browser-helper:
        applies-to: version-updates
        patterns: ["github.com/chromedp/*"]
      go-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: nuget
    # The root manifest supplies versions to services, MCP, tools, and tests.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      ef-core-major:
        applies-to: version-updates
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore"
          - "Npgsql.EntityFrameworkCore.PostgreSQL"
          - "SQLitePCLRaw.*"
        update-types: [major]
      ef-core-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore"
          - "Npgsql.EntityFrameworkCore.PostgreSQL"
          - "SQLitePCLRaw.*"
        update-types: [minor, patch]
      nuget-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
