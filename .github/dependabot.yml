version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/frontend, /services/core, /services/ingest]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /services/cli
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directories: [/services/core, /services/ingest, /services/shared]
    schedule:
      interval: weekly
