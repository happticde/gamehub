name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------
  # Job 1: Build + Test the .NET backend (Core + Ingest)
  # -------------------------------------------------------
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --verbosity quiet

      - name: Test
        run: dotnet test --no-build --verbosity quiet

  # -------------------------------------------------------
  # Job 2: Build the Next.js frontend (TypeScript check)
  # -------------------------------------------------------
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # -------------------------------------------------------
  # Job 3: Verify Docker images build successfully
  # -------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build Ingest image
        run: docker build -f services/ingest/Dockerfile -t gamehub-ingest:ci .

      - name: Build Core image
        run: docker build -f services/core/Dockerfile -t gamehub-core:ci .

      - name: Build frontend with macOS helper downloads
        run: docker build --build-context helper-source=./services/cli -f frontend/Dockerfile -t gamehub-frontend:ci frontend
