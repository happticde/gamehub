name: Build and security checks

on:
  workflow_call:
    inputs:
      release-version:
        type: string
        default: dev
        required: false
      select-changes:
        description: Select relevant jobs for PR and push events; releases always run all checks
        type: boolean
        default: false
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  select:
    name: Select relevant checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      workflow: ${{ steps.select.outputs.workflow }}
      semgrep: ${{ steps.select.outputs.semgrep }}
      dependencies: ${{ steps.select.outputs.dependencies }}
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      cli: ${{ steps.select.outputs.cli }}
      docs: ${{ steps.select.outputs.docs }}
      images: ${{ steps.select.outputs.images }}
      image-matrix: ${{ steps.select.outputs.image-matrix }}
      plan: ${{ steps.select.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify project license metadata
        run: python3 scripts/ci/check-licenses.py
      - name: Verify shared dependency versions
        run: python3 scripts/ci/check-dependencies.py
      - id: select
        env:
          SELECT_CHANGES: ${{ inputs.select-changes }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: python3 scripts/ci/select-checks.py select

  workflow:
    name: Workflow and release tooling
    needs: select
    if: needs.select.outputs.workflow == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/ci/install-tool.py actionlint "$RUNNER_TEMP/tools"
      - run: actionlint
      - run: python3 scripts/ci/install-tool.py git-cliff "$RUNNER_TEMP/tools"
      - run: python3 scripts/ci/install-tool.py gitleaks "$RUNNER_TEMP/tools"
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - run: shellcheck scripts/ci/*.sh services/cli/scripts/package-*.sh

  gitleaks:
    name: Secret history scan
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/ci/install-tool.py gitleaks "$RUNNER_TEMP/tools"
      - name: Scan history with redacted findings
        run: |
          mkdir -p reports
          bash scripts/ci/scan-secrets.sh reports/gitleaks.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gitleaks-report
          path: reports/gitleaks.json
          retention-days: 7

  semgrep:
    name: Static security patterns
    needs: select
    if: needs.select.outputs.semgrep == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export tracked source without environment files
        run: python3 scripts/ci/export-source.py "$RUNNER_TEMP/source"
      - name: Scan with reviewed local rules and no network
        run: |
          mkdir -p reports
          docker run --rm --network none \
            -v "$RUNNER_TEMP/source:/src:ro" -v "$PWD/reports:/reports" -w /src \
            --entrypoint /bin/sh \
            semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3 \
            -c 'for fixture in .ci/semgrep-fixtures/security.go .ci/semgrep-fixtures/security.cs .ci/semgrep-fixtures/security.ts; do
            semgrep --test --config .semgrep.yml "$fixture" --metrics=off --disable-version-check || exit $?; done &&
            semgrep scan --config .semgrep.yml --error --strict --metrics=off \
            --disable-version-check --exclude "tests/**" --exclude "*_test.go" \
            --exclude "frontend/tests/**" --exclude ".ci/semgrep-fixtures/**" \
            --sarif --output /reports/semgrep.sarif .'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-report
          path: reports/semgrep.sarif
          retention-days: 7

  dependencies:
    name: Dependencies and production configuration
    needs: select
    if: needs.select.outputs.dependencies == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/ci/install-tool.py trivy "$RUNNER_TEMP/tools"
      - run: python3 scripts/ci/export-source.py "$RUNNER_TEMP/source"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'services/**/*.csproj', 'tests/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Resolve transitive NuGet dependencies only in the scan snapshot
        run: |
          cd "$RUNNER_TEMP/source"
          dotnet restore --use-lock-file --verbosity quiet
      - name: Block fixable high and critical vulnerabilities and misconfigurations
        run: |
          mkdir -p reports
          trivy fs --scanners vuln,misconfig --include-dev-deps --skip-dirs '**/obj' \
            --format json --output reports/trivy-source.json "$RUNNER_TEMP/source"
          python3 scripts/ci/gate-trivy.py reports/trivy-source.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-source-report
          path: reports/trivy-source.json
          retention-days: 7

  docs:
    name: Documentation build and contracts
    needs: select
    if: needs.select.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/cli/go.mod
          cache: false
      - name: Build the local license notice collector
        run: |
          go build -o "$RUNNER_TEMP/license-notices" services/cli/tools/license-notices/main.go
          echo "GAMEHUB_NOTICE_GENERATOR=$RUNNER_TEMP/license-notices" >> "$GITHUB_ENV"
      - name: Install documentation dependencies (retry transient network failures)
        run: bash scripts/ci/npm-ci.sh docs/site
      - name: Test contracts and build the handbook (including release candidate when applicable)
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          if [[ "$RELEASE_VERSION" != dev ]]; then
            export DOCS_CANDIDATE_VERSION="$RELEASE_VERSION"
          fi
          npm run check
        working-directory: docs/site
      - run: python3 scripts/ci/install-tool.py trivy "$RUNNER_TEMP/tools"
      - run: python3 scripts/ci/export-source.py "$RUNNER_TEMP/docs-source"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-license-evidence
          path: docs/site/.generated/legal/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Scan documentation dependencies independently of application builds
        run: |
          mkdir -p reports
          trivy fs --scanners vuln --include-dev-deps --format json \
            --output reports/trivy-docs.json "$RUNNER_TEMP/docs-source/docs/site"
          python3 scripts/ci/gate-trivy.py reports/trivy-docs.json --target-prefix docs/site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: documentation-reports
          path: reports/trivy-docs.json
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend build and test
    needs: select
    if: needs.select.outputs.backend == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # This database exists only for this job and contains synthetic test data.
          POSTGRES_PASSWORD: gamehub-ci-only
          POSTGRES_DB: gamehub_tests
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      GAMEHUB_TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=gamehub_tests;Username=postgres;Password=gamehub-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'services/**/*.csproj', 'tests/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - run: dotnet restore
      - run: dotnet build --no-restore --verbosity quiet
      - run: dotnet test --no-build --verbosity quiet
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/cli/go.mod
          cache: false
      - name: Generate service dependency license evidence
        run: |
          go build -o "$RUNNER_TEMP/license-notices" services/cli/tools/license-notices/main.go
          for component in core ingest; do
            "$RUNNER_TEMP/license-notices" -kind nuget -input "services/$component/obj/project.assets.json" \
              -legal licensing -output "reports/licenses/$component"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-license-evidence
          path: reports/licenses/
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend lint, security contracts and build
    needs: select
    if: needs.select.outputs.frontend == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-24-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-next-24-${{ hashFiles('frontend/package-lock.json') }}-
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/cli/go.mod
          cache: false
      - name: Build the local license notice collector
        run: |
          go build -o "$RUNNER_TEMP/license-notices" services/cli/tools/license-notices/main.go
          echo "GAMEHUB_NOTICE_GENERATOR=$RUNNER_TEMP/license-notices" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run test:security && npm run test:physical-capture && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-license-evidence
          path: frontend/.generated/legal/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  cli:
    name: Go CLI tests and release packages
    needs: select
    if: needs.select.outputs.cli == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/cli/go.mod
          cache-dependency-path: services/cli/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test services/cli/scripts/test-macos-installer.mjs
      - name: Generate CLI dependency license evidence
        run: go run services/cli/tools/license-notices/main.go -kind go -input services/cli -legal licensing -output reports/cli-licenses
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-license-evidence
          path: reports/cli-licenses/
          if-no-files-found: error
          retention-days: 7
      - name: Test CLI and browser connection adapters
        run: go test -race ./... && go vet ./...
        working-directory: services/cli
        env:
          GAMEHUB_BROWSER_TESTS: '1'
      - run: python3 scripts/ci/install-tool.py trivy "$RUNNER_TEMP/tools"
      - name: Build and scan a versioned native CLI binary
        working-directory: services/cli
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          mkdir -p "$RUNNER_TEMP/cli-scan" "$GITHUB_WORKSPACE/reports"
          go build -trimpath -ldflags "-s -w -X happtic/gamehub-cli/cmd.Version=$RELEASE_VERSION" \
            -o "$RUNNER_TEMP/cli-scan/gamehub-cli" .
          trivy rootfs --scanners vuln --format json \
            --output "$GITHUB_WORKSPACE/reports/trivy-cli.json" "$RUNNER_TEMP/cli-scan"
          trivy convert --format cyclonedx --output "$GITHUB_WORKSPACE/reports/cli.cdx.json" \
            "$GITHUB_WORKSPACE/reports/trivy-cli.json"
          python3 "$GITHUB_WORKSPACE/scripts/ci/gate-trivy.py" "$GITHUB_WORKSPACE/reports/trivy-cli.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cli-security-report
          path: reports/
          retention-days: 7
      - name: Build release archives and checksums
        if: inputs.release-version != 'dev'
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          sh services/cli/scripts/package-release.sh "$RUNNER_TEMP/release-cli" "$RELEASE_VERSION"
          cp reports/cli.cdx.json "$RUNNER_TEMP/release-cli/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release-version != 'dev'
        with:
          name: release-cli
          path: ${{ runner.temp }}/release-cli/
          if-no-files-found: error
          retention-days: 7

  images:
    name: Image scan (${{ matrix.component }}, ${{ matrix.arch }})
    needs: [select, workflow, gitleaks, semgrep, dependencies, backend, frontend, cli, docs]
    if: >-
      ${{ always() && !cancelled() && needs.select.outputs.images == 'true'
          && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.image-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - run: python3 scripts/ci/install-tool.py trivy "$RUNNER_TEMP/tools"
      - name: Build the image that will be scanned and published
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ${{ matrix.component == 'frontend' && './frontend' || '.' }}
          file: ${{ matrix.component == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.component) }}
          build-contexts: |
            ${{ matrix.component == 'frontend' && 'helper-source=./services/cli' || '' }}
            ${{ matrix.component == 'frontend' && 'license-source=./licensing' || '' }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: gamehub-${{ matrix.component }}:verified
          build-args: |
            VERSION=${{ inputs.release-version == 'dev' && '0.0.0' || inputs.release-version }}
            REVISION=${{ github.sha }}
            SOURCE_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,version=2,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,version=2,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }},timeout=3m,ignore-error=true
      - name: Export generated image license evidence
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p reports/licenses
          container=$(docker create "gamehub-$COMPONENT:verified")
          trap 'docker rm "$container" >/dev/null' EXIT
          if [[ "$COMPONENT" == frontend ]]; then
            docker cp "$container:/app/public/legal/." reports/licenses/
          else
            docker cp "$container:/app/legal/." reports/licenses/
          fi
      - name: Scan runtime image and export its SBOM
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p reports
          trivy image --scanners vuln --format json \
            --output "reports/$COMPONENT-$ARCH.json" "gamehub-$COMPONENT:verified"
          trivy convert --format cyclonedx --output "reports/$COMPONENT-$ARCH.cdx.json" "reports/$COMPONENT-$ARCH.json"
          python3 scripts/ci/gate-trivy.py "reports/$COMPONENT-$ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-reports-${{ matrix.component }}-${{ matrix.arch }}
          path: reports/
          retention-days: 7
      - name: Save the verified release image
        if: inputs.release-version != 'dev'
        env:
          COMPONENT: ${{ matrix.component }}
        run: docker save "gamehub-$COMPONENT:verified" | gzip > "$RUNNER_TEMP/image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release-version != 'dev'
        with:
          name: release-image-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  required:
    name: CI passed
    if: always()
    needs: [select, workflow, gitleaks, semgrep, dependencies, backend, frontend, cli, docs, images]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all selected checks and reject unexpected skips
        env:
          CHECK_PLAN: ${{ needs.select.outputs.plan }}
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-checks.py gate
