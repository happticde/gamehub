# Production-Ready Docker Compose
# To deploy: docker compose up -d --build

services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Use the internal docker service name to connect to the backend
      - CORE_URL=http://core:8080
      - INGEST_URL=http://ingest:8080
      - AUTH_ENABLED=${GAMEHUB_FRONTEND_AUTH_ENABLED:-false}
      - AUTH_COOKIE_SECURE=${GAMEHUB_AUTH_COOKIE_SECURE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3000" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    restart: unless-stopped
    ports: [ "5000:8080" ]
    volumes: [ "gamehub_data:/app/data" ]
    environment:
      - Database__Provider=${INGEST_DB_PROVIDER:-Sqlite}
      - ConnectionStrings__DefaultConnection=${INGEST_DB_CONN:-Data Source=/app/data/ingest.db}
      - Authentication__ApiKey=${GAMEHUB_API_KEY:-}
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    restart: unless-stopped
    ports: [ "5001:8080" ]
    volumes: [ "gamehub_data:/app/data" ]
    environment:
      - Database__Provider=${CORE_DB_PROVIDER:-Postgres}
      - ConnectionStrings__Postgres=Host=db;Port=5432;Database=${POSTGRES_DB:-gamehub_core};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_password}
      - ConnectionStrings__Sqlite=Data Source=/app/data/core.db
      - Services__IngestUrl=http://ingest:8080
      - Authentication__ApiKey=${GAMEHUB_API_KEY:-}
      - Authentication__TenantId=${GAMEHUB_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      - Authentication__Jwt__SigningKey=${GAMEHUB_JWT_SIGNING_KEY:-}
      - Authentication__Jwt__RefreshTokenLifetimeDays=${GAMEHUB_JWT_REFRESH_TOKEN_DAYS:-30}
      - Igdb__ClientId=${IGDB_CLIENT_ID:-}
      - Igdb__ClientSecret=${IGDB_CLIENT_SECRET:-}
      - Logging__LogLevel__GameHub.Core.Services.IgdbClient=Warning
    depends_on:
      ingest:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-gamehub_core}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  gamehub_data:
