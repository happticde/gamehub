# Docker Compose for local development
# Run: docker compose up --build

services:
  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    ports: ["5000:8080"]
    volumes: ["./data:/app/data"]
    environment:
      - Database__Provider=Sqlite
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/ingest.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    ports: ["5001:8080"]
    volumes: ["./data:/app/data"]
    environment:
      - Database__Provider=Sqlite
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/core.db
      - Services__IngestUrl=http://ingest:8080
    depends_on:
      ingest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
