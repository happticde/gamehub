# Docker Compose for local development
# Run: docker compose up --build

services:
  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    ports: [ "5000:8080" ]
    volumes: [ "./data:/app/data" ]
    environment:
      - Database__Provider=Sqlite
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/ingest.db
      - Authentication__ApiKey=${GAMEHUB_API_KEY:-}
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/health" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    ports: [ "5001:8080" ]
    volumes: [ "./data:/app/data" ]
    environment:
      - Database__Provider=${CORE_DB_PROVIDER:-Postgres}
      - ConnectionStrings__Postgres=Host=db;Port=5432;Database=${POSTGRES_DB:-gamehub_core};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_password}
      - ConnectionStrings__Sqlite=Data Source=/app/data/core.db
      - Services__IngestUrl=http://ingest:8080
      - Authentication__ApiKey=${GAMEHUB_API_KEY:-}
      - Igdb__ClientId=${IGDB_CLIENT_ID:-}
      - Igdb__ClientSecret=${IGDB_CLIENT_SECRET:-}
      - Logging__LogLevel__GameHub.Core.Services.IgdbClient=Debug
    depends_on:
      ingest:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/health" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-gamehub_core}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
