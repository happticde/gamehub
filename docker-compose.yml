# Docker Compose for local development
# Run: docker compose up --build

services:
  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    ports: ["5000:8080"]
    volumes: ["./data:/app/data"]
    environment:
      - Database__Provider=Sqlite
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/ingest.db
      - Authentication__ApiKey=${GAMEHUB_API_KEY:-}
    healthcheck:
      # Use wget instead of curl — Alpine images don't include curl
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    ports: ["5001:8080"]
    volumes: ["./data:/app/data"]
    environment:
      - Database__Provider=Sqlite
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/core.db
      - Services__IngestUrl=http://ingest:8080
      - Authentication__ApiKey=${GAMEHUB_API_KEY:-}
      - Igdb__ClientId=${IGDB_CLIENT_ID:-}
      - Igdb__ClientSecret=${IGDB_CLIENT_SECRET:-}
    depends_on:
      ingest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
